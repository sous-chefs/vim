---
driver:
  name: vagrant

provisioner:
  name: chef_zero
  policyfile: Policyfile.rb
  named_run_list: <%= ENV.fetch('VIM_RUN_LIST', 'default') %>
  deprecations_as_errors: true
  enforce_idempotency: true
  multiple_converge: 2
  chef_license: accept-no-persist

verifier:
  name: inspec
  inspec_tests:
    - test/integration/<%= ENV.fetch('VIM_VERIFY_PROFILE', 'default') %>

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: fedora-latest
  - name: opensuse-leap-16
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: default
  - name: source
    provisioner:
      named_run_list: <%= ENV.fetch('VIM_RUN_LIST', 'source') %>
    verifier:
      inspec_tests:
        - test/integration/<%= ENV.fetch('VIM_VERIFY_PROFILE', 'source') %>
